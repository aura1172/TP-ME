<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TP ME</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap');
:root{--bg:#242527;--panel:#2c2d30;--text:#F3F3EE;--gold:#e11515;--goldb:#f3f3ee;--goldd:#7a0a0a;
--f:'Fredoka','Baloo 2','Arial Rounded MT Bold','Varela Round',ui-rounded,system-ui,sans-serif;
--f2:'Nunito','Varela Round',ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--text);font-family:var(--f2);font-weight:800}
#app{touch-action:none;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hud{display:flex;align-items:center;height:72px;font-family:var(--f);font-weight:600;font-size:24px}
.hc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.hc.mid{flex:0 0 auto;align-items:center}
.hc.rt{flex-direction:row;justify-content:flex-end;align-items:center}
#pw{display:flex;gap:10px;height:16px;align-items:center;overflow:hidden}
.pc{display:none;align-items:center;gap:5px;font-weight:700;font-size:11px;letter-spacing:.5px;color:var(--c);white-space:nowrap}
.pc .bar{width:38px;height:7px;border-radius:4px;background:#34353a;overflow:hidden}
.pc .bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.pc em{font-style:normal;min-width:20px}
#hud b{color:var(--gold);font-weight:700;margin-left:6px}
canvas{display:block;border-radius:6px}
.screen{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(36,37,39,.88)}
.screen.solid{background:var(--bg)}
.screen.on{display:flex}
.title{font-family:var(--f);font-weight:700;font-size:min(17vw,125px);line-height:1;margin:0;color:var(--gold);text-shadow:0 7px 0 var(--goldd),0 16px 28px rgba(0,0,0,.7)}
h2{font-family:var(--f);font-weight:700;font-size:50px;margin:0 0 6px;color:var(--gold);text-shadow:0 4px 0 var(--goldd)}
.big{font-family:var(--f);font-weight:600;font-size:28px}
.big b{color:var(--gold);font-weight:700;margin-left:10px}
.btn,.sq{border:7px solid #8f0d0d;color:var(--text);font-family:var(--f);font-weight:700;cursor:pointer;outline:0;
background:linear-gradient(#ff3030 0 50%,#e11515 50% 100%);
box-shadow:inset 0 0 0 3px #ff4a4a,0 6px 0 #7a0a0a,0 10px 18px rgba(0,0,0,.5);
text-shadow:0 3px 0 rgba(0,0,0,.45);transition:transform .08s,filter .15s}
.btn{width:340px;max-width:84vw;height:92px;border-radius:999px;font-size:32px;letter-spacing:1.5px}
.btn.sm{width:132px;height:62px;font-size:21px;letter-spacing:.5px;border-width:5px}
.sq{width:58px;height:58px;border-radius:16px;font-size:22px;border-width:5px}
.btn:hover,.sq:hover{filter:brightness(1.13)}
.btn:active,.sq:active{transform:translateY(4px);box-shadow:inset 0 0 0 3px #ff4a4a,0 2px 0 #7a0a0a}
.btn.sel{filter:brightness(1.2) drop-shadow(0 0 9px var(--gold))}
.btn.off{filter:brightness(.6) grayscale(.35)}
.panel{background:var(--panel);border:3px solid #3d3e42;border-radius:30px;padding:26px 30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:14px}
.row label{width:104px;font-family:var(--f);font-weight:600;font-size:23px;color:var(--gold)}
input[type=range]{width:210px;height:30px;accent-color:var(--gold);cursor:pointer}
 .spbox{width:132px;height:54px;display:flex;align-items:center;justify-content:center;gap:4px;background:#1b1c1e;border:3px solid #55565b;border-radius:16px;font-family:var(--f);font-weight:700;font-size:24px;color:var(--gold);cursor:text}
.spbox:focus-within{border-color:var(--gold)}
#spn{width:62px;border:0;background:none;outline:0;padding:0;text-align:right;font:inherit;color:var(--text);user-select:text;-webkit-user-select:text}
#nb{color:var(--goldb);font-family:var(--f);font-weight:700;font-size:26px;height:30px}
.btn.lv{height:74px;font-size:28px}
#rot{display:none;z-index:20;text-align:center;padding:20px}

@media (max-height:520px){
#hud{height:54px;font-size:18px}
.pc{font-size:9px;gap:3px}.pc .bar{width:28px;height:6px}
.sq{width:38px;height:38px;font-size:16px;border-width:4px;border-radius:12px}
.screen{gap:8px}
.title{font-size:64px;text-shadow:0 4px 0 var(--goldd),0 8px 14px rgba(0,0,0,.7)}
h2{font-size:32px;margin:0}
.big{font-size:20px}
.btn{height:54px;font-size:22px;border-width:4px;letter-spacing:1px;box-shadow:inset 0 0 0 2px #ff4a4a,0 4px 0 #7a0a0a,0 6px 10px rgba(0,0,0,.5)}
.btn.sm{width:100px;height:44px;font-size:15px;border-width:3px}
.btn.lv{height:40px;font-size:20px}
.panel{padding:12px 16px;gap:8px;border-radius:20px}
.row label{width:78px;font-size:17px}
input[type=range]{width:150px}
#nb{font-size:20px;height:22px}
.spbox{width:100px;height:40px;font-size:18px;border-width:2px;border-radius:12px}#spn{width:46px;font-size:18px}
}

#wall{position:absolute;left:0;top:0;width:100%;height:100%;display:none;border-radius:0;z-index:1}
#app.inmenu #wall{display:block}
#app.inmenu #hud,#app.inmenu #cv{visibility:hidden}
.screen.glass{background:rgba(27,28,30,.45)}
#home{flex-direction:row;align-items:stretch;justify-content:flex-start;gap:0;background:none}
#menuCol{position:relative;width:380px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;padding:max(10px,min(16vh,calc((100vh - 520px)*.7))) 0 0 34px;background:none;box-shadow:none}
#menuCol .title{width:330px;text-align:center;white-space:nowrap;font-size:72px;text-shadow:0 5px 0 var(--goldd),0 10px 18px rgba(0,0,0,.7);margin-bottom:2px}
#menuCol .big{width:330px;text-align:center;font-size:22px;margin-bottom:24px}
.btn.mb{width:330px;max-width:none;height:60px;border:0;border-radius:18px;font-style:italic;font-weight:700;font-size:27px;letter-spacing:1.5px;text-align:left;padding:0 0 0 26px;color:#fff;background:linear-gradient(#ff3b3b 0 50%,#e11515 50% 100%);box-shadow:inset 0 0 0 3px #ff6a6a,0 5px 0 #7a0a0a,0 0 18px rgba(225,21,21,.45),0 8px 14px rgba(0,0,0,.5);text-shadow:0 3px 0 rgba(0,0,0,.35);filter:none;transform:none;transition:transform .12s,box-shadow .12s,filter .12s;display:flex;align-items:center;line-height:1}
.btn.mb{position:relative}
@media (hover:hover){.btn.mb:hover{filter:brightness(1.12);transform:translateX(10px);box-shadow:inset 0 0 0 3px #ff8a8a,0 5px 0 #7a0a0a,0 0 26px rgba(225,21,21,.7),0 8px 14px rgba(0,0,0,.5)}
/* keeps the pointer on the button after it slides right, so it can't flicker */
.btn.mb:hover::before{content:'';position:absolute;top:0;bottom:-6px;left:-12px;width:14px}}
.btn.mb:active{filter:brightness(1.12);transform:translateX(10px) translateY(4px);box-shadow:inset 0 0 0 3px #ff8a8a,0 1px 0 #7a0a0a,0 0 16px rgba(225,21,21,.6)}
.cards{display:flex;gap:20px;align-items:stretch;justify-content:center}
.card{position:relative;padding:0;border:4px solid #3d3e42;border-radius:18px;overflow:hidden;background:#1b1c1e;cursor:pointer;outline:0;font-family:var(--f);transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.card canvas{display:block;width:100%;height:auto;border-radius:0}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;text-align:left;font-weight:700;letter-spacing:2px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));text-shadow:0 3px 0 rgba(0,0,0,.5)}
.card:hover{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 14px 34px rgba(0,0,0,.6)}
.card:active{filter:brightness(.92)}
.cards.five .card{width:min(17.5vw,226px)}
.cards.five .lb{font-size:clamp(12px,1.7vw,22px)}
.cards.five{--g:10px;--w:min(22vw,280px,38vh);flex-wrap:wrap;width:calc(3*var(--w) + 2*var(--g));gap:var(--g)}
.cards.five .card{width:var(--w)}
#toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:30;padding:12px 26px;border-radius:999px;background:rgba(36,37,39,.95);border:3px solid var(--gold);color:var(--gold);font-family:var(--f);font-weight:700;font-size:20px;letter-spacing:1.5px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#stats{align-items:center;justify-content:center}
.sp{width:min(88vw,1100px);height:min(78vh,640px);background:rgba(36,37,39,.94);border:3px solid #3d3e42;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;overflow:hidden}
.shead{font-family:var(--f);font-weight:700;font-size:26px;letter-spacing:2px;color:var(--gold);padding:14px 26px;border-bottom:3px solid #3d3e42;flex:0 0 auto}
.sbody{flex:1;min-height:0;display:flex}
.side{width:230px;flex:0 0 auto;padding:16px;display:flex;flex-direction:column;gap:8px;border-right:3px solid #3d3e42;overflow:auto}
.sb{font-family:var(--f);font-weight:700;font-size:20px;text-align:left;letter-spacing:1px;padding:12px 16px;border-radius:12px;border:0;background:#2f3033;color:var(--text);cursor:pointer;outline:0}
.sb:hover{background:#3a3b3f}
.sb.sel{background:linear-gradient(#ff3030 0 50%,#e11515 50% 100%);box-shadow:inset 0 0 0 2px #ff4a4a;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sdata{flex:1;min-width:0;padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sdata h3{margin:0;font-family:var(--f);font-weight:700;font-size:30px;color:var(--gold);letter-spacing:1.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tl{background:#2f3033;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tl span{font-family:var(--f);font-weight:600;font-size:15px;color:#a8a9a4;letter-spacing:1px}
.tl b{font-family:var(--f);font-weight:700;font-size:32px;color:var(--text)}
.sfoot{padding:12px 20px;border-top:3px solid #3d3e42;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
@media (max-height:520px){
.sp{width:94vw;height:92vh;border-radius:18px}
.shead{font-size:18px;padding:8px 16px}
.side{width:150px;padding:8px;gap:4px}.sb{font-size:13px;padding:6px 10px;border-radius:9px}
.sdata{padding:10px 14px;gap:8px}.sdata h3{font-size:20px}
.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tl{padding:8px 10px;border-radius:10px;gap:2px}.tl span{font-size:11px}.tl b{font-size:20px}
.sfoot{padding:6px 14px}
#menuCol{width:250px;padding:max(8px,calc((100vh - 320px)*.4)) 0 0 18px;gap:6px}
#menuCol .title{width:215px;font-size:44px}#menuCol .big{width:215px;font-size:15px;margin-bottom:8px}
.btn.mb{width:215px;height:40px;font-size:18px;padding-left:16px;border-radius:12px;box-shadow:inset 0 0 0 2px #ff6a6a,0 3px 0 #7a0a0a,0 0 12px rgba(225,21,21,.4)}
.cards{gap:10px}.card{border-width:3px;border-radius:12px}.card .lb{padding:16px 8px 5px}
#toast{font-size:15px;padding:8px 18px;bottom:14px}
}
/* reset stats pop-up */
.btn.sm.rsb{width:auto;min-width:170px;padding:0 22px;white-space:nowrap}
.btn.danger,.btn.danger:active{border-color:#e11515;background:linear-gradient(#4a4b50 0 50%,#35363a 50% 100%)}
.btn.danger{box-shadow:inset 0 0 0 3px #e11515,0 6px 0 #121314,0 10px 18px rgba(0,0,0,.5)}
.btn.danger:active{box-shadow:inset 0 0 0 3px #e11515,0 2px 0 #121314}
#rsm{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
#rsm.on{display:flex}
.rsbox{width:min(92vw,520px);max-height:94vh;overflow:auto;background:var(--panel);border:3px solid #3d3e42;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.7);padding:24px 28px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.rsbox h3{margin:0;font-family:var(--f);font-weight:700;font-size:28px;letter-spacing:1px;color:var(--gold)}
.rsbox p{margin:0;font-size:17px;line-height:1.45}
#rspick,#rssure{width:100%;display:none;flex-direction:column;align-items:center;gap:18px}
#rspick.on,#rssure.on{display:flex}
.rsgrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsgrid .sb{text-align:center}
.rsgrid .sb.all{background:#4a2320;color:#FFB4AD}
.rsgrid .sb.all:hover{background:#5c2a26}
.rsrow{display:flex;gap:16px;justify-content:center}
@media (max-height:520px){
.btn.sm.rsb{min-width:130px;padding:0 14px}
.btn.danger{box-shadow:inset 0 0 0 2px #e11515,0 4px 0 #121314,0 6px 10px rgba(0,0,0,.5)}
.rsbox{padding:12px 18px 16px;gap:8px;border-radius:18px}
.rsbox h3{font-size:19px}.rsbox p{font-size:13px}
#rspick,#rssure{gap:10px}.rsgrid{gap:6px}
}

/* ===== every-device layout + touch ===== */
html,body{touch-action:none;-webkit-touch-callout:none}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#toast{max-width:92vw}
@media (max-width:760px) and (orientation:portrait){
 #hud{height:52px;font-size:16px}#hud b{margin-left:4px}
 .pc{font-size:8px;gap:2px}.pc .bar{width:20px;height:5px}#pw{gap:5px}
 .sq{width:40px;height:40px;font-size:16px;border-width:4px;border-radius:12px}
 h2{font-size:34px}.btn{height:62px;font-size:24px;border-width:5px}
 .btn.sm{width:100px;height:46px;font-size:16px;border-width:4px}
 .panel{padding:16px 14px;gap:12px;border-radius:22px;max-width:94vw}
 .row{gap:8px}.row label{width:62px;font-size:17px}input[type=range]{width:min(34vw,170px)}
 .spbox{width:84px;height:44px;font-size:18px;border-width:2px;border-radius:12px}#spn{width:40px;font-size:18px}
 #home{justify-content:center}
 #menuCol{width:min(92vw,380px);padding:max(10px,10vh) 0 0 0;align-items:center}
 #menuCol .title{width:100%;font-size:min(20vw,76px)}#menuCol .big{width:100%}
 .btn.mb{width:min(80vw,330px);height:58px;font-size:24px}
 .cards.five{--w:min(29vw,200px,24vh);--g:8px}
 .cards.five .lb{font-size:12px;letter-spacing:1px;padding:14px 8px 6px}
 .card{border-width:3px;border-radius:12px}
 .sp{width:96vw;height:90vh;border-radius:18px}.shead{font-size:20px;padding:10px 16px}
 .sbody{flex-direction:column}
 .side{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:3px solid #3d3e42;padding:8px;gap:6px}
 .sb{white-space:nowrap;font-size:14px;padding:8px 12px;flex:0 0 auto}
 .sdata{padding:12px}.sdata h3{font-size:22px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
 .tl{padding:10px 12px}.tl b{font-size:22px}.tl span{font-size:12px}.sfoot{padding:8px 12px}
 .rsbox{padding:16px 16px 20px}.rsbox h3{font-size:22px}.rsbox p{font-size:15px}
 #toast{font-size:16px;padding:10px 18px;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){.title{font-size:min(17vw,64px)}.btn{font-size:20px}.row label{width:52px;font-size:15px}input[type=range]{width:30vw}}
</style>
</head><body>
<div id="app" class="inmenu"><canvas id="wall"></canvas>
 <div id="hud"><div class="hc"><div>SCORE<b id="sc">0</b></div><div id="pw">
  <div class="pc" id="pc_shield" style="--c:#f3f3ee"><span>SHIELD</span><div class="bar"><i></i></div><em></em></div>
  <div class="pc" id="pc_dbl" style="--c:#FFB020"><span>2X</span><div class="bar"><i></i></div><em></em></div>
  <div class="pc" id="pc_ghost" style="--c:#B9BDC9"><span>GHOST</span><div class="bar"><i></i></div><em></em></div>
  <div class="pc" id="pc_slow" style="--c:#5BE37D"><span>SLOW</span><div class="bar"><i></i></div><em></em></div>
 </div></div><div class="hc mid"><div>BEST<b id="hs">0</b></div></div><div class="hc rt"><button class="sq" data-a="pause" title="Pause (Esc)">II</button></div></div>
 <canvas id="cv"></canvas>
 <div id="home" class="screen on"><div id="menuCol"><h1 class="title">TP ME</h1><div class="big">BEST<b id="hi">0</b></div><button class="btn mb" data-a="play">PLAY</button><button class="btn mb" data-a="settings">SETTINGS</button><button class="btn mb" data-a="stats">STATS</button></div></div>
<div id="stats" class="screen glass"><div class="sp"><div class="shead">STATS</div><div class="sbody"><div class="side" id="sside"></div><div class="sdata"><h3 id="sh">ALL MODES</h3><div class="grid" id="sg"></div></div></div><div class="sfoot"><button class="btn sm rsb danger" data-a="rsopen">RESET STATS</button><button class="btn sm" data-a="back">BACK</button></div></div>
<div id="rsm" role="dialog" aria-modal="true"><div class="rsbox"><div id="rspick"><h3>RESET STATS</h3><p>Which game mode do you want to reset?</p><div class="rsgrid" id="rsg"></div><button class="btn sm" data-a="rsclose">CANCEL</button></div><div id="rssure"><h3>ARE YOU SURE?</h3><p id="rstext"></p><div class="rsrow"><button class="btn sm rsb" data-a="rsopen">NO, GO BACK</button><button class="btn sm rsb danger" data-a="rsyes">YES, RESET</button></div></div></div></div></div>
 <div id="settings" class="screen solid"><h2>SETTINGS</h2>
  <div class="panel">
   <div class="row"><label for="spn">SPEED</label><input type="range" id="spd" min="10" max="100" step="10" aria-label="Game speed"><div class="spbox"><input type="text" id="spn" inputmode="numeric" maxlength="4" autocomplete="off" enterkeyhint="done"><span>%</span></div></div>
   <div class="row"><label>MUSIC</label><input type="range" id="mv" min="0" max="100"><button class="btn sm" id="mm" data-a="mm">ON</button></div>
   <div class="row"><label>SFX</label><input type="range" id="sv" min="0" max="100"><button class="btn sm" id="sm" data-a="sm">ON</button></div>
  </div>
  <button class="btn" data-a="back">BACK</button></div>
 <div id="levels" class="screen glass"><h2>SELECT LEVEL</h2><div class="cards five"><button class="card" data-a="level" data-v="4"><canvas data-pv="baby" width="640" height="400"></canvas><span class="lb">BABY</span></button><button class="card" data-a="level" data-v="0"><canvas data-pv="easy" width="640" height="400"></canvas><span class="lb">EASY</span></button><button class="card" data-a="level" data-v="1"><canvas data-pv="normal" width="640" height="400"></canvas><span class="lb">NORMAL</span></button><button class="card" data-a="level" data-v="2"><canvas data-pv="hard" width="640" height="400"></canvas><span class="lb">HARD</span></button><button class="card" data-a="level" data-v="3"><canvas data-pv="xhard" width="640" height="400"></canvas><span class="lb">EXTRA HARD</span></button></div><button class="btn" data-a="back">BACK</button></div>
 <div id="rot" class="screen solid"><h2>ROTATE YOUR PHONE</h2><div class="big">Play in landscape 📱</div></div>
 <div id="pause" class="screen"><h2>PAUSED</h2><button class="btn" data-a="resume">RESUME</button><button class="btn" data-a="restart">RESTART</button><button class="btn" data-a="settings">SETTINGS</button><button class="btn" data-a="home">HOME</button></div>
 <div id="over" class="screen"><h2>GAME OVER</h2><div class="big">SCORE<b id="fs">0</b></div><div class="big">BEST<b id="fh">0</b></div><div id="nb"></div><button class="btn" data-a="restart">RESTART</button><button class="btn" data-a="home">HOME</button></div>
</div>
<script>
const COLS=32,ROWS=20;
const COLLISION_GRACE=0.2;
const TELE_DIST=3,TELE_AHEAD=5;
const INVUL=0.5,PORTAL=0.3;
const SPD_MIN=4,SPD_MAX=12; // moves per second at 10% and at 100%
/* any number becomes the nearest of 10,20..100 */
const snapSpeed=v=>Math.min(100,Math.max(10,Math.round(v/10)*10));
const SPEED_STEP=.006,SPEED_EVERY=3,MIN_FACTOR=.55;
const START_LEN=3,RMIN=7,RMAX=14;

const SPECIAL_GAP_MIN=1,SPECIAL_GAP_MAX=12,SPECIAL_LIFE=8,GOLD_LIFE=4; // a special fruit appears after a completely random number of bananas (1..12); seconds on board
const DURIAN_CHANCE=.20;                                 // chance a special spawn is the durian bomb (Normal and up) -> 20%
const MULTI_ODDS=[[5,.01],[4,.02],[3,.03],[2,.04]];      // chance per special spawn that 5 / 4 / 3 / 2 good fruits appear together (1% / 2% / 3% / 4%)
function rollSpecialPlan(baby,hasDurian){                 // every fruit ends up at ~20% chance to be in a spawn
 if(baby)return{n:1,durian:false};
 const r=Math.random();let acc=0;
 if(hasDurian){acc=DURIAN_CHANCE;if(r<acc)return{n:1,durian:true}}
 for(const m of MULTI_ODDS){acc+=m[1];if(r<acc)return{n:m[0],durian:false}}
 return{n:1,durian:false}}
function rollGap(){return SPECIAL_GAP_MIN+Math.floor(Math.random()*(SPECIAL_GAP_MAX-SPECIAL_GAP_MIN+1))}

const BABY_LVL=4;   // BABY level: open board, a random fruit (no bomb) appears after EVERY banana
const DURIAN_MIN_LVL=1;                                 // 0 easy,1 normal,2 hard,3 extra hard -> durian from Normal up
const BOOM_TIME=1.4;

try{Object.assign(S,JSON.parse(localStorage.getItem('tp_settings')||'{}'));const h=JSON.parse(localStorage.getItem('tp_hi2')||'[]');for(let i=0;i<5;i++)HI[i]=+h[i]||0}catch(e){}
hi=HI[0];
/* older saves stored SLOW / NORMAL / FAST */
{const old={slow:30,normal:50,fast:80}[S.speed],n=parseFloat(S.speed);S.speed=old||(isFinite(n)?snapSpeed(n):50)}
const save=()=>{HI[lvl]=hi;try{localStorage.setItem('tp_settings',JSON.stringify(S));localStorage.setItem('tp_hi2',JSON.stringify(HI))}catch(e){}};

function applyVol(){if(ac){mg.gain.value=S.mm?0:S.mv*.35;sg.gain.value=S.sm?0:S.sv}}
function tone(f,d,type,f2,v,t0,out){if(!ac)return;const t=ac.currentTime+(t0||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.25,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(out||sg);o.start(t);o.stop(t+d+.05)}
function noise(d,f1,f2,v){if(!ac)return;const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.value=v;s.connect(f);f.connect(g);g.connect(sg);s.start(t)}

function warn(r){if(!ac)return;if(r<0){if(wo){try{wo.stop()}catch(e){}wo=null}return}
 if(!wo){wo=ac.createOscillator();wg=ac.createGain();wo.type='square';wg.gain.value=.07;wo.connect(wg);wg.connect(sg);wo.start()}wo.frequency.value=220+r*520}
function startMusic(){const ch=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];let step=0,next=ac.currentTime+.2;
 (function sch(){while(next<ac.currentTime+.7){const c=ch[(step>>3)%4],n=c[[0,1,2,1][step%4]]*(step%8>=4?2:1),o=next-ac.currentTime;tone(n,1,'sine',0,.5,o,mg);if(step%8==0)tone(c[0]/2,3,'triangle',0,.45,o,mg);step++;next+=.42}setTimeout(sch,150)})()}
